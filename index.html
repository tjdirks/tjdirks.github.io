<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomas Dirks</title>
  <meta name="description" content="Thomas Dirks – M&A and Corporate Finance.">
  <meta name="theme-color" content="#e9eff7">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thomas Dirks">
  <meta property="og:description" content="M&A · Corporate Finance">
  <meta property="og:url" content="https://t-dirks.de/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1624'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%230ea5e9'%3ETD%3C/text%3E%3C/svg%3E">

  <script>
    // Apply theme before first paint: saved choice, else the OS preference.
    (function () {
      var dark;
      try { dark = localStorage.getItem('dark-mode'); } catch (e) {}
      if (dark === null || dark === undefined) {
        dark = String(window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      if (dark === 'true') document.documentElement.classList.add('dark');
    })();
  </script>

  <style>
    @property --a {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    :root {
      --bg: #e9eff7;
      --text: #0d1b2a;
      --accent: #0ea5e9;
      --accent-text: #0284c7;
      --surface: rgba(255, 255, 255, 0.7);
      --border: rgba(13, 27, 42, 0.12);
      --field: rgba(255, 255, 255, 0.7);
      --code: rgba(15, 23, 42, 0.08);
      --glow-1: rgba(14, 165, 233, 0.18);
      --glow-2: rgba(2, 132, 199, 0.18);
      --glow-3: rgba(148, 163, 184, 0.2);
      --shadow: 0 25px 60px rgba(15, 23, 42, 0.15);
      color-scheme: light;
    }

    :root.dark {
      --bg: #0b1624;
      --text: #f2f5f9;
      --accent-text: #0ea5e9;
      --surface: rgba(13, 27, 42, 0.7);
      --border: rgba(242, 245, 249, 0.18);
      --field: rgba(13, 27, 42, 0.6);
      --code: rgba(15, 23, 42, 0.5);
      --glow-2: rgba(59, 130, 246, 0.18);
      --glow-3: rgba(51, 65, 85, 0.4);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 20%, var(--glow-1), transparent 55%),
        radial-gradient(circle at 85% 10%, var(--glow-2), transparent 50%),
        radial-gradient(circle at 50% 80%, var(--glow-3), transparent 55%);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .page {
      padding: 2.5rem 1.5rem 3.5rem;
      display: flex;
      justify-content: center;
    }

    /* Card with a rotating conic-gradient border driven by the animated --a angle */
    .card {
      position: relative;
      width: min(960px, 100%);
      background: var(--surface);
      border-radius: 28px;
      padding: 2.5rem;
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      animation: spin 6s linear infinite;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--a),
        transparent 0deg,
        var(--accent) 70deg,
        #38bdf8 110deg,
        transparent 180deg,
        transparent 360deg
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      pointer-events: none;
    }

    @keyframes spin {
      to { --a: 360deg; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      * { transition: none !important; }
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .hero { text-align: center; }

    h1 {
      font-size: clamp(2.2rem, 3vw, 3.2rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1.1rem;
      margin: 0 0 1.5rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.6rem;
      background: var(--text);
      color: var(--bg);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
    }

    .links a:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 16px 35px rgba(14, 165, 233, 0.35);
    }

    .links a.secondary {
      background: transparent;
      color: inherit;
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .links a.secondary:hover {
      border-color: transparent;
      background: rgba(14, 165, 233, 0.12);
      color: inherit;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .toggle {
      position: relative;
      width: 50px;
      height: 26px;
      flex: none;
    }

    .toggle input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .slider {
      position: absolute;
      inset: 0;
      background-color: #ccc;
      border-radius: 26px;
      transition: background-color 0.3s;
      pointer-events: none;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle input:checked + .slider { background-color: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(24px); }
    .toggle input:focus-visible + .slider {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .emergency {
      margin-top: 2.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .emergency button {
      font: inherit;
      background: none;
      border: none;
      color: var(--accent-text);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .emergency .action-button {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      box-shadow: 0 10px 20px rgba(14, 165, 233, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .emergency .action-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(14, 165, 233, 0.4);
    }

    .unlock-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .emergency input {
      font: inherit;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: inherit;
    }

    .emergency .error {
      margin: 0.75rem 0 0;
      color: #dc2626;
      font-size: 0.9rem;
    }

    :root.dark .emergency .error { color: #f87171; }

    .emergency pre {
      background: var(--code);
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem 0 0.5rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      .card { padding: 1.8rem; }
      .header { flex-direction: column; }
      .links { width: 100%; }
      .links a { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <header class="header">
        <div class="hero">
          <h1>Thomas Dirks</h1>
          <p class="subtitle">M&amp;A · Corporate Finance</p>

          <nav class="links" aria-label="Links">
            <a href="https://www.linkedin.com/in/tjdirks" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a class="secondary" id="emailLink" href="#" data-user="thomas" data-domain="t-dirks.de">Contact</a>
          </nav>
        </div>

        <label class="toggle-container">
          <span>Dark Mode</span>
          <span class="toggle">
            <input type="checkbox" id="darkToggle" role="switch">
            <span class="slider"></span>
          </span>
        </label>
      </header>

      <section class="emergency" aria-label="Emergency information">
        <button type="button" id="revealButton" aria-expanded="false" aria-controls="unlockSection">🔒 Emergency</button>

        <div id="unlockSection" hidden>
          <form class="unlock-row" id="unlockForm">
            <input type="password" id="emergencyPass" placeholder="Enter passcode" aria-label="Passcode" autocomplete="off">
            <button type="submit" class="action-button">Unlock</button>
          </form>
          <p class="error" id="emergencyError" role="alert" hidden>Invalid passcode.</p>
          <div id="emergencyResult" hidden>
            <pre id="emergencyInfo"></pre>
            <button type="button" id="hideButton">Hide</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="crypto-js.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // Contact link: assembled at runtime to keep the address out of the static HTML
    const emailLink = $('emailLink');
    emailLink.href = `mailto:${emailLink.dataset.user}@${emailLink.dataset.domain}`;

    // Dark mode (initial state is set by the inline script in <head>)
    const root = document.documentElement;
    const toggle = $('darkToggle');
    toggle.checked = root.classList.contains('dark');
    toggle.addEventListener('change', () => {
      root.classList.toggle('dark', toggle.checked);
      try { localStorage.setItem('dark-mode', toggle.checked); } catch (e) {}
    });

    // Emergency info
    const encrypted = "U2FsdGVkX1/KY71QQxzMiekEDYlZ8CJ/2KpVF7+r8WeGCeWy6awReP1r5bwcPVeptk7WGW1zEL5lCxMkTqCso0DWJZdoBsF0SxoKRMo1cak=";
    const revealButton = $('revealButton');
    const unlockSection = $('unlockSection');
    const passInput = $('emergencyPass');
    const errorMsg = $('emergencyError');
    const result = $('emergencyResult');
    const info = $('emergencyInfo');

    revealButton.addEventListener('click', () => {
      unlockSection.hidden = false;
      revealButton.hidden = true;
      revealButton.setAttribute('aria-expanded', 'true');
      passInput.focus();
    });

    $('unlockForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let text = '';
      try {
        text = CryptoJS.AES.decrypt(encrypted, passInput.value).toString(CryptoJS.enc.Utf8);
      } catch (err) {}
      if (!text) {
        errorMsg.hidden = false;
        result.hidden = true;
        return;
      }
      errorMsg.hidden = true;
      info.textContent = text;
      result.hidden = false;
    });

    $('hideButton').addEventListener('click', () => {
      info.textContent = '';
      result.hidden = true;
      passInput.value = '';
      passInput.focus();
    });
  </script>
</body>
</html>
