<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomas Dirks</title>
  <meta name="description" content="Thomas Dirks – M&A and Corporate Finance.">
  <meta name="theme-color" content="#05080f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thomas Dirks">
  <meta property="og:description" content="M&A · Corporate Finance">
  <meta property="og:url" content="https://t-dirks.de/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305080f'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%2338bdf8'%3ETD%3C/text%3E%3C/svg%3E">

  <script>
    // Dark is the default; only an explicit "light" choice is remembered.
    (function () {
      var dark = true;
      try { dark = localStorage.getItem('dark-mode') !== 'false'; } catch (e) {}
      if (dark) document.documentElement.classList.add('dark');
      // SVG filters inside backdrop-filter only work in Chromium; others get a plain blur.
      var b = navigator.userAgentData && navigator.userAgentData.brands;
      if (b && b.some(function (x) { return /Chromium/.test(x.brand); })) {
        document.documentElement.classList.add('lg');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Refraction filter used by the .glass backdrop (Chromium) -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
      <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
      <feDisplacementMap in="SourceGraphic" in2="nb" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="backdrop" aria-hidden="true">
    <span class="orb"></span><span class="orb"></span><span class="orb"></span>
  </div>

  <div class="page">
    <main class="card glass">
      <div class="top">
        <span class="status">M&amp;A · Corporate Finance</span>
        <label class="pill">
          <span>Dark</span>
          <span class="toggle">
            <input type="checkbox" id="darkToggle" role="switch">
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <h1>Thomas Dirks</h1>
      <p class="chip">MSc Finance</p>

      <nav class="links" aria-label="Links">
        <a class="btn primary" href="https://www.linkedin.com/in/tjdirks" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="btn" id="emailLink" href="#" data-user="thomas" data-domain="t-dirks.de">Contact</a>
      </nav>

      <section class="emergency" aria-label="Emergency information">
        <button type="button" class="reveal" id="revealButton" aria-expanded="false" aria-controls="unlockSection">🔒 Emergency</button>

        <div id="unlockSection" hidden>
          <form class="unlock-row" id="unlockForm">
            <input type="password" id="emergencyPass" placeholder="Enter passcode" aria-label="Passcode" autocomplete="off">
            <button type="submit" class="btn primary">Unlock</button>
          </form>
          <p class="error" id="emergencyError" role="alert" hidden>Invalid passcode.</p>
          <div id="emergencyResult" hidden>
            <pre id="emergencyInfo"></pre>
            <button type="button" class="reveal" id="hideButton">Hide</button>
          </div>
        </div>
      </section>
    </main>
    <footer class="foot"><a href="imprint.html">Imprint</a></footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // Contact link: assembled at runtime to keep the address out of the static HTML
    const emailLink = $('emailLink');
    emailLink.href = `mailto:${emailLink.dataset.user}@${emailLink.dataset.domain}`;

    // Dark mode (initial state is set by the inline script in <head>)
    const root = document.documentElement;
    const toggle = $('darkToggle');
    toggle.checked = root.classList.contains('dark');
    toggle.addEventListener('change', () => {
      root.classList.toggle('dark', toggle.checked);
      try { localStorage.setItem('dark-mode', toggle.checked); } catch (e) {}
    });

    // Emergency info
    const encrypted = "jjTTUFhoaDLbaiU/QZXhT1haWH1OjbV7WaiI2uobHdXs53GeDESW9thj9S3A7LWDhmdBag8eFdix";
    const revealButton = $('revealButton');
    const unlockSection = $('unlockSection');
    const passInput = $('emergencyPass');
    const errorMsg = $('emergencyError');
    const result = $('emergencyResult');
    const info = $('emergencyInfo');

    revealButton.addEventListener('click', () => {
      unlockSection.hidden = false;
      revealButton.hidden = true;
      revealButton.setAttribute('aria-expanded', 'true');
      passInput.focus();
    });

    // Payload = base64(salt[16] | iv[12] | AES-GCM ciphertext); key = PBKDF2-SHA256(passcode)
    async function decrypt(passcode) {
      const data = Uint8Array.from(atob(encrypted), (ch) => ch.charCodeAt(0));
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(passcode), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: data.slice(0, 16), iterations: 600000, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(16, 28) }, key, data.slice(28));
      return new TextDecoder().decode(plain);
    }

    $('unlockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let text = '';
      try {
        text = await decrypt(passInput.value);
      } catch (err) {}
      if (!text) {
        errorMsg.hidden = false;
        result.hidden = true;
        return;
      }
      errorMsg.hidden = true;
      info.textContent = text;
      result.hidden = false;
    });

    $('hideButton').addEventListener('click', () => {
      info.textContent = '';
      result.hidden = true;
      passInput.value = '';
      passInput.focus();
    });
  </script>
</body>
</html>
